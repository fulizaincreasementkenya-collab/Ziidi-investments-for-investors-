<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Investor Workspace</title><link rel="stylesheet" href="/styles.css"></head>
<body class="auth-body">
  <div class="auth-card">
    <a class="brand" href="/"><span class="brand-mark">↗</span><span>ZIIDI <b>INVESTOR</b></span></a>
    <h1>Welcome back</h1><p>Sign in to your investment workspace.</p>
    <form id="loginForm">
      <label>Email<input name="email" type="email" autocomplete="email" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn btn-green btn-large full" type="submit">Sign in</button>
      <div id="message" class="message"></div>
    </form>
    <p class="auth-foot">New investor? <a href="/register.html">Create an account</a></p>
  </div>
  <script src="/auth.js"></script>
</body>
</html>
